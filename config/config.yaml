paths:
  data_dir: data
  outputs_dir: outputs

omics:
  counts_path: data/TCGA-COAD.star_counts.tsv
  cohort: TCGA-COAD
  dataset_label: STAR-Counts-log2p1

gene_mapping:
  cache_path: data/ensembl_to_symbol_cache.tsv
  use_api: true

candidates:
  top_n: 500
  fdr_threshold: 0.05
  output_path: outputs/candidates.csv

pubmed:
  email: azc6461@psu.edu
  tool: biomarker-ranker
  api_key: "54270c921b5f22b9701eaca6768a71430c08"
  max_abstracts_per_gene: 5
  query_templates:
    - "colorectal cancer {gene}"
    - "colon cancer {gene}"
    - "rectal cancer {gene}"

pathway:
  source: gprofiler
  fdr_threshold: 0.05
  sources:
    - "GO:BP"
    - "KEGG"
    - "REAC"
    - "WP"

ml_importance:
  n_folds: 5
  top_n_features: 5000   # pre-select top genes by variance for RF + SHAP

scoring:
  weights:
    omics: 0.40
    ml_importance: 0.10
    literature: 0.30
    pathway: 0.20
