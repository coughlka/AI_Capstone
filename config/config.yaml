paths:
  data_dir: data
  outputs_dir: outputs

omics:
  counts_path: data/TCGA-COAD.star_counts.tsv
  cohort: TCGA-COAD
  dataset_label: STAR-Counts-log2p1

gene_mapping:
  cache_path: data/ensembl_to_symbol_cache.tsv
  use_api: true

candidates:
  top_n: 500
  fdr_threshold: 0.05
  output_path: outputs/candidates.csv

pubmed:
  email: azc6461@psu.edu
  tool: biomarker-ranker
  # api_key: Set NCBI_API_KEY env var in .env instead of hardcoding here
  max_abstracts_per_gene: 5
  query_templates:
    - "colorectal cancer {gene}"
    - "colon cancer {gene}"
    - "rectal cancer {gene}"

pathway:
  source: gprofiler
  fdr_threshold: 0.05
  sources:
    - "GO:BP"
    - "KEGG"
    - "REAC"
    - "WP"

ml_importance:
  n_folds: 5
  top_n_features: 5000   # pre-select top genes by variance for RF + SHAP

scoring:
  weights:
    omics: 0.40
    ml_importance: 0.10
    literature: 0.30
    pathway: 0.20

# Within-COAD MMR deficiency classifier (Ayan Choudhury's module).
# Run via: python run_mmr_classifier.py --config config/config.yaml
mmr:
  expression_path: data/TCGA-COAD.star_counts.tsv
  phenotype_path: data/TCGA-COAD.GDC_phenotype.tsv
  output_dir: outputs/coad_mmr_classifier
  phenotype_barcode_col: submitter_id.samples
  phenotype_label_col: loss_expression_of_mismatch_repair_proteins_by_ihc
  test_size: 0.20
  random_state: 42
  cv_folds: 5
  min_nonzero_fraction: 0.10
  variance_threshold: 0.0
  top_k_features: 1000
  n_jobs: -1
  min_class_size: 15
  biomarker_candidates_file: outputs/ranked_candidates.csv
  biomarker_gene_col: gene
  biomarker_score_col: final_score
  compare_top_n_shap: 100
  compare_top_n_biomarkers: 500
